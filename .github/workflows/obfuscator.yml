name: Advanced Protected APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct APK URL"
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup NDK
        id: ndk_setup_unique
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y wget unzip git zip python3 cmake ninja-build

      - name: Download APK
        run: wget -O input.apk "${{ github.event.inputs.apk_url }}"

      - name: Get apktool
        run: wget https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar

      - name: Decode APK
        run: java -jar apktool.jar d input.apk -o apk_decoded

      - name: Extract all DEX
        run: |
          unzip -o input.apk -d extracted
          mkdir dex
          find extracted -name "classes*.dex" -exec cp {} dex/ \;

      - name: Clone obfuscator
        run: git clone https://github.com/radioegor146/native-obfuscator.git

      - name: Patch shadowJar fix
        run: |
          python3 -c "
p='native-obfuscator/obfuscator/build.gradle'
f=open(p,'a')
f.write('\n\ntasks.withType(com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configureEach {\n')
f.write('mergeServiceFiles()\n')
f.write(\"exclude 'META-INF/*.SF'\\n\")
f.write(\"exclude 'META-INF/*.DSA'\\n\")
f.write(\"exclude 'META-INF/*.RSA'\\n\")
f.write('duplicatesStrategy = DuplicatesStrategy.EXCLUDE\n}\n')
f.close()
"

      - name: Build obfuscator
        run: |
          cd native-obfuscator
          ./gradlew build shadowJar

      - name: Select JAR
        run: |
          cd native-obfuscator/obfuscator/build/libs
          JAR=$(ls -S *.jar | grep -v plain | head -n 1)
          echo "JAR=$JAR" >> $GITHUB_ENV

      - name: Install dex2jar
        run: |
          wget https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-2.4.zip
          unzip dex-tools-2.4.zip
          chmod +x dex-tools-2.4/*.sh

      - name: Convert ALL dex
        run: |
          mkdir jars
          for f in dex/*.dex; do
            dex-tools-2.4/d2j-dex2jar.sh "$f" -o jars/$(basename "$f").jar || true
          done

      - name: Run obfuscator on all jars
        run: |
          mkdir cpp
          for f in jars/*.jar; do
            java -jar native-obfuscator/obfuscator/build/libs/$JAR "$f" cpp || true
          done

      - name: Inject anti-tamper + anti-debug
        run: |
          python3 -c "
import os
code = r'''
#include <jni.h>
#include <string.h>
#include <unistd.h>

extern \"C\" JNIEXPORT jboolean JNICALL
Java_com_protect_Check_verify(JNIEnv* env, jobject thiz) {
    FILE* f = fopen(\"/proc/self/status\", \"r\");
    if (!f) return JNI_TRUE;
    char line[256];
    while (fgets(line, sizeof(line), f)) {
        if (strstr(line, \"TracerPid\")) {
            if (strcmp(line, \"TracerPid:\\t0\\n\") != 0) {
                fclose(f);
                return JNI_FALSE;
            }
        }
    }
    fclose(f);
    return JNI_TRUE;
}
'''
open('cpp/protect.cpp','w').write(code)
"

      - name: Build SO (arm64)
        run: |
          mkdir build
          cd build
          cmake ../cpp \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          cmake --build .
          mkdir -p ../libs/arm64-v8a
          find . -name "*.so" -exec cp {} ../libs/arm64-v8a/ \;

      - name: Build SO (armeabi-v7a)
        run: |
          rm -rf build/*
          cd build
          cmake ../cpp \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          cmake --build .
          mkdir -p ../libs/armeabi-v7a
          find . -name "*.so" -exec cp {} ../libs/armeabi-v7a/ \;

      - name: Remove DEX
        run: rm apk_decoded/classes*.dex || true

      - name: Inject SO
        run: |
          mkdir -p apk_decoded/lib/arm64-v8a
          mkdir -p apk_decoded/lib/armeabi-v7a
          cp libs/arm64-v8a/*.so apk_decoded/lib/arm64-v8a/ || true
          cp libs/armeabi-v7a/*.so apk_decoded/lib/armeabi-v7a/ || true

      - name: Force load library (smali)
        run: |
          python3 -c "
import os
for root, dirs, files in os.walk('apk_decoded/smali'):
    for f in files:
        if f.endswith('.smali'):
            path=os.path.join(root,f)
            data=open(path).read()
            if 'loadLibrary' not in data:
                data=data.replace('.method public constructor <init>()V',
                '.method public constructor <init>()V\n    const-string v0, \"protect\"\n    invoke-static {v0}, Ljava/lang/System;->loadLibrary(Ljava/lang/String;)V')
                open(path,'w').write(data)
                break
"

      - name: Rebuild APK
        run: java -jar apktool.jar b apk_decoded -o unsigned.apk

      - name: Sign APK
        run: |
          wget https://dl.google.com/android/repository/build-tools_r34-linux.zip
          unzip build-tools_r34-linux.zip
          keytool -genkey -v -keystore key.jks -storepass 123456 -alias key -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=App,O=App,C=US"
          build-tools/android-34/apksigner sign --ks key.jks --ks-pass pass:123456 --key-pass pass:123456 --out final.apk unsigned.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: protected-apk
          path: final.apk

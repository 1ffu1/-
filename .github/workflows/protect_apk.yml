name: 🔐 Sho APK Protection

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'رابط APK (اختياري)'
        required: false
        default: ''

jobs:
  protect-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 📦 تثبيت Android SDK
      run: |
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        mkdir -p $HOME/android/cmdline-tools
        unzip -q cmdline-tools.zip -d $HOME/android/cmdline-tools
        mv $HOME/android/cmdline-tools/cmdline-tools $HOME/android/cmdline-tools/latest
        export ANDROID_HOME=$HOME/android
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --licenses > /dev/null 2>&1
        sdkmanager "build-tools;34.0.0" > /dev/null 2>&1
        echo "ANDROID_HOME=$HOME/android" >> $GITHUB_ENV
        echo "BUILD_TOOLS=$HOME/android/build-tools/34.0.0" >> $GITHUB_ENV
        echo "$HOME/android/build-tools/34.0.0" >> $GITHUB_PATH
        echo "$HOME/android/cmdline-tools/latest/bin" >> $GITHUB_PATH

    - name: 🔧 تثبيت apktool و dex2jar و ProGuard
      run: |
        mkdir -p $HOME/bin
        wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O $HOME/bin/apktool
        wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O $HOME/bin/apktool.jar
        chmod +x $HOME/bin/apktool
        echo "$HOME/bin" >> $GITHUB_PATH
        wget -q https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip
        unzip -q dex-tools-v2.4.zip
        chmod +x dex-tools-v2.4/d2j-*.sh
        echo "DEX2JAR=$(pwd)/dex-tools-v2.4/d2j-dex2jar.sh" >> $GITHUB_ENV
        wget -q https://github.com/Guardsquare/proguard/releases/download/v7.4.2/proguard-7.4.2.zip
        unzip -q proguard-7.4.2.zip
        echo "PROGUARD_JAR=$(pwd)/proguard-7.4.2/lib/proguard.jar" >> $GITHUB_ENV

    - name: 📲 الحصول على APK
      run: |
        if [ -n "${{ github.event.inputs.apk_url }}" ]; then
          wget -q "${{ github.event.inputs.apk_url }}" -O input.apk
        elif [ -f "app.apk" ]; then
          cp app.apk input.apk
        else
          echo "❌ ضع app.apk في المستودع أو أدخل رابطاً"
          exit 1
        fi
        ls -lh input.apk

    - name: 🔓 فك APK بـ apktool
      run: |
        $HOME/bin/apktool d input.apk -o apk_decoded -f
        ls apk_decoded/

    - name: 🔄 DEX -> JAR بـ dex2jar
      run: |
        mkdir -p jars
        for dex in apk_decoded/*.dex; do
          name=$(basename "$dex" .dex)
          "$DEX2JAR" "$dex" -o "jars/${name}.jar" --force 2>/dev/null && echo "✓ $name" || echo "⚠ $name"
        done
        ls -lh jars/

    - name: 🌀 تشويش بـ ProGuard
      run: |
        mkdir -p obf_jars
        for jar in jars/*.jar; do
          name=$(basename "$jar" .jar)
          java -jar "$PROGUARD_JAR" \
            -injars "$jar" \
            -outjars "obf_jars/${name}_obf.jar" \
            -libraryjars "<java.home>/jmods/java.base.jmod(!**.jar;!module-info.class)" \
            -dontoptimize -dontpreverify \
            -repackageclasses '' \
            -allowaccessmodification \
            -keep "class * extends android.app.Activity" \
            -keep "class * extends android.app.Service" \
            -keep "class * extends android.content.BroadcastReceiver" \
            -keepattributes "*Annotation*,Signature,Exceptions" \
            2>/dev/null && echo "✓ $name" || echo "⚠ $name"
        done

    - name: 🛡️ إضافة Anti-Debug smali
      run: |
        mkdir -p apk_decoded/smali/com/sho/security
        printf '.class public Lcom/sho/security/Guard;\n.super Ljava/lang/Object;\n.method public static isDebugging()Z\n    .locals 1\n    invoke-static {}, Landroid/os/Debug;->isDebuggerConnected()Z\n    move-result v0\n    return v0\n.end method\n' > apk_decoded/smali/com/sho/security/Guard.smali
        echo "✓ Guard.smali مضاف"

    - name: 📦 إعادة تجميع APK
      run: |
        $HOME/bin/apktool b apk_decoded -o sho_rebuilt.apk
        ls -lh sho_rebuilt.apk

    - name: 🗝️ توقيع APK
      run: |
        PASS="${{ secrets.KEYSTORE_PASS }}"
        [ -z "$PASS" ] && PASS="sho_secure_2025"
        keytool -genkeypair -v \
          -keystore sho.keystore -alias sho_key \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass "$PASS" -keypass "$PASS" \
          -dname "CN=Sho,OU=Dev,O=Sho,L=SA,ST=Riyadh,C=SA" 2>/dev/null
        $BUILD_TOOLS/zipalign -v 4 sho_rebuilt.apk sho_aligned.apk
        $BUILD_TOOLS/apksigner sign \
          --ks sho.keystore \
          --ks-pass pass:"$PASS" \
          --key-pass pass:"$PASS" \
          --out sho_protected_signed.apk \
          sho_aligned.apk
        $BUILD_TOOLS/apksigner verify --verbose sho_protected_signed.apk
        ls -lh sho_protected_signed.apk

    - name: 📤 رفع APK المحمية
      uses: actions/upload-artifact@v4
      with:
        name: sho-protected-apk
        path: sho_protected_signed.apk
        retention-days: 7

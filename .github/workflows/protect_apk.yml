name: Extreme Dex2C Protection

on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: 'اسم ملف الـ APK الموجود في المستودع'
        required: true
        default: 'base.apk'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Android NDK
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Clone Dex2C Tool (dcc)
        run: |
          git clone --depth 1 https://github.com/r0ysue/dcc.git
          cd dcc
          pip install -r requirements.txt

      - name: Execute Protection (Dex2C)
        run: |
          # تشغيل أداة التحويل على الملف المرفوع
          # سيتم تحويل الميثودز إلى كود C++ وتجميعها في ملف .so
          python3 dcc/dcc.py ${{ github.event.inputs.apk_name }} \
          --ndk ${{ env.ANDROID_NDK_HOME }} \
          --output protected_output.apk

      - name: Upload Protected APK
        uses: actions/upload-artifact@v4
        with:
          name: Hardened-App-Package
          path: protected_output.apk

name: Advanced Protected APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup NDK
        id: ndk_unique_id
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y wget unzip git zip cmake ninja-build python3

      - name: Prepare APK
        run: cp input/app.apk input.apk

      - name: Download apktool
        run: wget https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar

      - name: Decode APK
        run: java -jar apktool.jar d input.apk -o apk_decoded

      - name: Extract DEX
        run: |
          unzip -o input.apk -d extracted
          mkdir dex
          find extracted -name "classes*.dex" -exec cp {} dex/ \;

      - name: Clone native-obfuscator
        run: git clone https://github.com/radioegor146/native-obfuscator.git

      - name: Fix shadowJar issue
        run: |
          echo "" >> native-obfuscator/obfuscator/build.gradle
          echo "tasks.withType(com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configureEach {" >> native-obfuscator/obfuscator/build.gradle
          echo "    mergeServiceFiles()" >> native-obfuscator/obfuscator/build.gradle
          echo "    exclude 'META-INF/*.SF'" >> native-obfuscator/obfuscator/build.gradle
          echo "    exclude 'META-INF/*.DSA'" >> native-obfuscator/obfuscator/build.gradle
          echo "    exclude 'META-INF/*.RSA'" >> native-obfuscator/obfuscator/build.gradle
          echo "    duplicatesStrategy = DuplicatesStrategy.EXCLUDE" >> native-obfuscator/obfuscator/build.gradle
          echo "}" >> native-obfuscator/obfuscator/build.gradle

      - name: Build obfuscator
        run: |
          cd native-obfuscator
          ./gradlew build shadowJar

      - name: Select JAR
        run: |
          cd native-obfuscator/obfuscator/build/libs
          JAR=$(ls -S *.jar | grep -v plain | head -n 1)
          echo "JAR=$JAR" >> $GITHUB_ENV

      - name: Install dex2jar
        run: |
          wget https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-2.4.zip
          unzip dex-tools-2.4.zip
          chmod +x dex-tools-2.4/*.sh

      - name: Convert DEX to JAR
        run: |
          mkdir jars
          for f in dex/*.dex; do
            dex-tools-2.4/d2j-dex2jar.sh "$f" -o jars/$(basename "$f").jar || true
          done

      - name: Run obfuscator
        run: |
          mkdir cpp
          for f in jars/*.jar; do
            java -jar native-obfuscator/obfuscator/build/libs/$JAR "$f" cpp || true
          done

      - name: Add anti-debug C++
        run: |
          echo '#include <jni.h>' >> cpp/protect.cpp
          echo '#include <stdio.h>' >> cpp/protect.cpp
          echo '#include <string.h>' >> cpp/protect.cpp
          echo 'extern "C" JNIEXPORT jboolean JNICALL Java_com_protect_Check_verify(JNIEnv* env, jobject thiz) {' >> cpp/protect.cpp
          echo 'FILE* f = fopen("/proc/self/status","r");' >> cpp/protect.cpp
          echo 'if (!f) return JNI_TRUE;' >> cpp/protect.cpp
          echo 'char line[256];' >> cpp/protect.cpp
          echo 'while (fgets(line,sizeof(line),f)) {' >> cpp/protect.cpp
          echo 'if (strstr(line,"TracerPid")) {' >> cpp/protect.cpp
          echo 'if (strcmp(line,"TracerPid:\t0\n") != 0) {' >> cpp/protect.cpp
          echo 'fclose(f); return JNI_FALSE; }}}' >> cpp/protect.cpp
          echo 'fclose(f); return JNI_TRUE; }' >> cpp/protect.cpp

      - name: Build arm64
        run: |
          mkdir build
          cd build
          cmake ../cpp \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          cmake --build .
          mkdir -p ../libs/arm64-v8a
          find . -name "*.so" -exec cp {} ../libs/arm64-v8a/ \;

      - name: Build armeabi
        run: |
          rm -rf build/*
          cd build
          cmake ../cpp \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          cmake --build .
          mkdir -p ../libs/armeabi-v7a
          find . -name "*.so" -exec cp {} ../libs/armeabi-v7a/ \;

      - name: Remove DEX
        run: rm apk_decoded/classes*.dex || true

      - name: Add SO
        run: |
          mkdir -p apk_decoded/lib/arm64-v8a
          mkdir -p apk_decoded/lib/armeabi-v7a
          cp libs/arm64-v8a/*.so apk_decoded/lib/arm64-v8a/ || true
          cp libs/armeabi-v7a/*.so apk_decoded/lib/armeabi-v7a/ || true

      - name: Force load library
        run: |
          python3 -c "
import os
for root, dirs, files in os.walk('apk_decoded/smali'):
    for f in files:
        if f.endswith('.smali'):
            p=os.path.join(root,f)
            d=open(p).read()
            if 'loadLibrary' not in d:
                d=d.replace('.method public constructor <init>()V',
                '.method public constructor <init>()V\n    const-string v0, \"protect\"\n    invoke-static {v0}, Ljava/lang/System;->loadLibrary(Ljava/lang/String;)V')
                open(p,'w').write(d)
                break
"

      - name: Rebuild APK
        run: java -jar apktool.jar b apk_decoded -o unsigned.apk

      - name: Sign APK
        run: |
          wget https://dl.google.com/android/repository/build-tools_r34-linux.zip
          unzip build-tools_r34-linux.zip
          keytool -genkey -v -keystore key.jks -storepass 123456 -alias key -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=App,O=App,C=US"
          build-tools/android-34/apksigner sign --ks key.jks --ks-pass pass:123456 --key-pass pass:123456 --out final.apk unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: protected-apk
          path: final.apk

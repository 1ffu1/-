name: 🔐 Sho APK - DEX to Native (.so)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'رابط APK (اختياري - أو ضع app.apk في المستودع)'
        required: false
        default: ''

jobs:
  dex-to-native:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    # ─────────────────────────────────────────
    - name: 📥 Checkout
      uses: actions/checkout@v4

    # ─────────────────────────────────────────
    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # ─────────────────────────────────────────
    - name: 📱 Setup Android NDK + SDK
      uses: android-actions/setup-android@v3

    - name: 🔩 تثبيت NDK 25
      run: |
        sdkmanager "ndk;25.2.9519653" "build-tools;34.0.0" > /dev/null 2>&1
        echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
        echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_ENV
        echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
        echo "✓ NDK: $ANDROID_HOME/ndk/25.2.9519653"

    # ─────────────────────────────────────────
    - name: 🔧 تثبيت apktool
      run: |
        mkdir -p $HOME/bin
        wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" \
             -O $HOME/bin/apktool.jar
        printf '#!/bin/bash\njava -jar %s/bin/apktool.jar "$@"\n' "$HOME" > $HOME/bin/apktool
        chmod +x $HOME/bin/apktool
        echo "$HOME/bin" >> $GITHUB_PATH
        echo "✓ apktool OK"

    # ─────────────────────────────────────────
    - name: 🔧 تثبيت dex2jar
      run: |
        wget -q https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip
        unzip -q dex-tools-v2.4.zip
        chmod +x dex-tools-v2.4/d2j-*.sh
        echo "DEX2JAR=$(pwd)/dex-tools-v2.4/d2j-dex2jar.sh" >> $GITHUB_ENV
        echo "✓ dex2jar OK"

    # ─────────────────────────────────────────
    - name: 🔧 تثبيت native-obfuscator
      run: |
        git clone --depth=1 https://github.com/radioegor146/native-obfuscator.git
        cd native-obfuscator
        chmod +x gradlew
        ./gradlew jar -x test --no-daemon -q 2>/dev/null || ./gradlew shadowJar -x test --no-daemon -q
        # البحث عن الـ jar الناتج
        JAR=$(find . -name "*.jar" -path "*/build/libs/*" | grep -v sources | head -1)
        echo "NATIVE_OBF_JAR=$(pwd)/$JAR" >> $GITHUB_ENV
        echo "✓ native-obfuscator: $JAR"

    # ─────────────────────────────────────────
    - name: 📲 الحصول على APK
      run: |
        if [ -n "${{ github.event.inputs.apk_url }}" ]; then
          wget -q "${{ github.event.inputs.apk_url }}" -O input.apk
        elif [ -f "app.apk" ]; then
          cp app.apk input.apk
        else
          echo "❌ ضع app.apk في المستودع أو أدخل رابطاً"
          exit 1
        fi
        ls -lh input.apk

    # ─────────────────────────────────────────
    - name: 🔓 فك APK بـ apktool
      run: |
        $HOME/bin/apktool d input.apk -o apk_decoded -f
        echo "✓ DEX files:"
        ls -lh apk_decoded/*.dex 2>/dev/null || find apk_decoded -name "*.dex"

    # ─────────────────────────────────────────
    - name: 🔄 DEX -> JAR بـ dex2jar
      run: |
        mkdir -p jars
        # نحوّل classes.dex الرئيسي فقط (كود التطبيق)
        # classes2+ عادةً مكتبات خارجية لا حاجة لتحويلها
        for dex in apk_decoded/classes.dex apk_decoded/classes2.dex; do
          [ -f "$dex" ] || continue
          name=$(basename "$dex" .dex)
          echo "→ تحويل $name ..."
          "$DEX2JAR" "$dex" -o "jars/${name}.jar" --force 2>/dev/null \
            && echo "  ✓ $name.jar" || echo "  ⚠ تعذّر $name"
        done
        ls -lh jars/

    # ─────────────────────────────────────────
    - name: 🧬 تحويل JAR -> C++ بـ native-obfuscator
      run: |
        mkdir -p native_output
        for jar in jars/*.jar; do
          name=$(basename "$jar" .jar)
          echo "→ native-obfuscator على $name ..."
          java -jar "$NATIVE_OBF_JAR" \
            "$jar" \
            "native_output/${name}" \
            2>/dev/null && echo "  ✓ $name" || echo "  ⚠ تعذّر $name"
        done
        echo "✓ ملفات C++ المولّدة:"
        find native_output -name "*.cpp" | head -20
        echo "المجموع: $(find native_output -name "*.cpp" | wc -l) ملف C++"

    # ─────────────────────────────────────────
    - name: ⚙️ تجميع C++ -> .so بـ NDK
      run: |
        mkdir -p jni_build/jni
        # نسخ كل ملفات C++ إلى مجلد JNI
        find native_output -name "*.cpp" -exec cp {} jni_build/jni/ \;
        find native_output -name "*.h"   -exec cp {} jni_build/jni/ \;

        # Android.mk
        printf 'LOCAL_PATH := $(call my-dir)\ninclude $(CLEAR_VARS)\nLOCAL_MODULE    := sho_native\nLOCAL_SRC_FILES := $(wildcard $(LOCAL_PATH)/*.cpp)\nLOCAL_LDLIBS    := -llog -landroid\ninclude $(BUILD_SHARED_LIBRARY)\n' \
          > jni_build/jni/Android.mk

        # Application.mk
        printf 'APP_ABI := arm64-v8a armeabi-v7a\nAPP_STL := c++_shared\nAPP_OPTIM := release\n' \
          > jni_build/jni/Application.mk

        # بناء المكتبات
        cd jni_build
        $NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk -j$(nproc) 2>/dev/null
        echo "✓ .so files:"
        find libs -name "*.so" -exec ls -lh {} \;

    # ─────────────────────────────────────────
    - name: 📦 دمج .so في APK
      run: |
        # إنشاء مجلدات lib في APK المفكوك
        mkdir -p apk_decoded/lib/arm64-v8a
        mkdir -p apk_decoded/lib/armeabi-v7a

        # نسخ المكتبات
        cp jni_build/libs/arm64-v8a/*.so   apk_decoded/lib/arm64-v8a/  2>/dev/null || true
        cp jni_build/libs/armeabi-v7a/*.so apk_decoded/lib/armeabi-v7a/ 2>/dev/null || true

        # إبقاء DEX المحوّل فقط (الأصلي بعد تعديل native-obfuscator)
        # native-obfuscator يولّد DEX جديد يستدعي الـ .so
        find native_output -name "*.dex" -exec cp {} apk_decoded/ \; 2>/dev/null || true

        echo "✓ محتوى lib:"
        ls -lh apk_decoded/lib/arm64-v8a/
        ls -lh apk_decoded/lib/armeabi-v7a/

    # ─────────────────────────────────────────
    - name: 🏗️ إعادة تجميع APK
      run: |
        $HOME/bin/apktool b apk_decoded -o sho_rebuilt.apk
        ls -lh sho_rebuilt.apk

    # ─────────────────────────────────────────
    - name: 🗝️ توقيع APK
      run: |
        PASS="${{ secrets.KEYSTORE_PASS }}"
        [ -z "$PASS" ] && PASS="sho_secure_2025"

        keytool -genkeypair -v \
          -keystore sho.keystore -alias sho_key \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass "$PASS" -keypass "$PASS" \
          -dname "CN=Sho,OU=Dev,O=Sho,L=SA,ST=Riyadh,C=SA" 2>/dev/null

        $BUILD_TOOLS/zipalign -v 4 sho_rebuilt.apk sho_aligned.apk

        $BUILD_TOOLS/apksigner sign \
          --ks sho.keystore \
          --ks-pass pass:"$PASS" \
          --key-pass pass:"$PASS" \
          --out sho_protected_signed.apk \
          sho_aligned.apk

        $BUILD_TOOLS/apksigner verify --verbose sho_protected_signed.apk
        echo "✓ APK موقّع ومحمي"
        ls -lh sho_protected_signed.apk

    # ─────────────────────────────────────────
    - name: 📊 تقرير الحماية
      run: |
        echo "════════════════════════════════"
        echo "  تقرير حماية Sho APK"
        echo "════════════════════════════════"
        echo "DEX files في APK الجديد:"
        find apk_decoded -name "*.dex" | wc -l
        echo "SO libraries:"
        find apk_decoded/lib -name "*.so" 2>/dev/null | wc -l
        echo "حجم APK النهائي:"
        ls -lh sho_protected_signed.apk
        echo "════════════════════════════════"

    # ─────────────────────────────────────────
    - name: 📤 رفع APK المحمية
      uses: actions/upload-artifact@v4
      with:
        name: sho-protected-native-apk
        path: sho_protected_signed.apk
        retention-days: 30

name: APK Native Obfuscator

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct URL to the APK file'
        required: true
        type: string

jobs:
  native-obfuscate:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Download input APK
        run: |
          curl -fsSL -o input.apk "${{ github.event.inputs.apk_url }}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip python3

      - name: Download and setup dex2jar
        run: |
          curl -fsSL -o dex2jar.zip https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip
          unzip -q dex2jar.zip
          mv dex-tools-2.4 dex2jar
          chmod +x dex2jar/bin/*.sh

      - name: Download and setup apktool
        run: |
          curl -fsSL -o apktool.jar https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar
          curl -fsSL -o apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          chmod +x apktool
          mkdir -p $HOME/bin
          mv apktool $HOME/bin/
          mv apktool.jar $HOME/bin/
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Download and setup Android SDK Build Tools for apksigner
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Extract DEX from APK using dex2jar
        run: |
          mkdir -p dex_output
          ./dex2jar/bin/d2j-dex2jar.sh -o dex_output/classes.jar input.apk

      - name: Clone native-obfuscator
        run: |
          git clone https://github.com/radioegor146/native-obfuscator.git

      - name: Fix ShadowJar META-INF issue in native-obfuscator
        run: |
          python3 -c "
          import os
          build_file = 'native-obfuscator/obfuscator/build.gradle'
          with open(build_file, 'a') as f:
              f.write('\n')
              f.write('tasks.withType(com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configureEach {\n')
              f.write('    mergeServiceFiles()\n')
              f.write(\"    exclude 'META-INF/*.SF'\\n\")
              f.write(\"    exclude 'META-INF/*.DSA'\\n\")
              f.write(\"    exclude 'META-INF/*.RSA'\\n\")
              f.write('    duplicatesStrategy = DuplicatesStrategy.EXCLUDE\n')
              f.write('}\n')
          "

      - name: Build native-obfuscator with Gradle
        run: |
          cd native-obfuscator
          ./gradlew :obfuscator:shadowJar --no-daemon

      - name: Select correct native-obfuscator JAR
        id: select-jar
        run: |
          JAR_PATH=$(ls -S native-obfuscator/obfuscator/build/libs/*.jar | grep -v plain | head -n 1)
          echo "jar_path=$JAR_PATH" >> $GITHUB_OUTPUT
          echo "Selected JAR: $JAR_PATH"
          ls -lh "$JAR_PATH"

      - name: Run native-obfuscator on classes.jar
        run: |
          mkdir -p cpp_output
          java -jar "${{ steps.select-jar.outputs.jar_path }}" dex_output/classes.jar cpp_output

      - name: Prepare CMake toolchain and build script for NDK
        run: |
          cat > build_so.sh << 'BUILD_EOF'
          #!/bin/bash
          set -e
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          ABI=$1
          BUILD_DIR="build_$ABI"
          mkdir -p "$BUILD_DIR"
          cmake -S cpp_output -B "$BUILD_DIR" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$BUILD_DIR" --parallel $(nproc)
          BUILD_EOF
          chmod +x build_so.sh

      - name: Build native libraries for arm64-v8a
        run: |
          ./build_so.sh arm64-v8a

      - name: Build native libraries for armeabi-v7a
        run: |
          ./build_so.sh armeabi-v7a

      - name: Decompile APK with apktool
        run: |
          apktool d -o decompiled_apk -f input.apk

      - name: Replace DEX with native libraries in decompiled APK
        run: |
          rm -rf decompiled_apk/*.dex
          mkdir -p decompiled_apk/lib/arm64-v8a
          mkdir -p decompiled_apk/lib/armeabi-v7a
          cp build_arm64-v8a/*.so decompiled_apk/lib/arm64-v8a/ || true
          cp build_armeabi-v7a/*.so decompiled_apk/lib/armeabi-v7a/ || true

      - name: Rebuild APK with apktool
        run: |
          apktool b -o unsigned.apk decompiled_apk

      - name: Sign APK with apksigner
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out signed_obfuscated.apk unsigned.apk

      - name: Upload obfuscated APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: obfuscated-apk
          path: signed_obfuscated.apk
          retention-days: 7

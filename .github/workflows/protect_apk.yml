name: Extreme Dex2C Protection

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: 'رابط مباشر لملف الـ APK أو تأكد من وجوده في المستودع'
        required: true
        default: 'app.apk'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Python 3
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Android NDK
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Clone Dex2C Tool (dcc)
        run: |
          git clone --depth 1 https://github.com/r0ysue/dcc.git
          cd dcc
          pip install -r requirements.txt

      - name: Execute Protection (Full Conversion)
        run: |
          # ملاحظة: سنستخدم خيار تحويل كل شيء، لكن يفضل استثناء كلاسات النظام
          # dcc يحتاج ملف apk ومدخلات معينة
          python3 dcc/dcc.py ${{ github.event.inputs.apk_path }} \
          --ndk ${{ env.ANDROID_NDK_HOME }} \
          --output protected_app.apk
          
      - name: Sign APK (Optional but Recommended)
        run: |
          # هنا تضع أوامر التوقيع بـ jks الخاص بك لتتمكن من تثبيت التطبيق
          echo "Signing logic goes here..."

      - name: Upload Protected APK
        uses: actions/upload-artifact@v3
        with:
          name: Protected-Hardened-APK
          path: protected_app.apk

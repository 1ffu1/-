name: Professional Targeted Protection (Full Graph Support)

on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: 'اسم ملف الـ APK (مثلاً app.apk)'
        required: true
        default: 'app.apk'
      my_package:
        description: 'الباكج نيم الخاص بك (مثلاً com/example/app)'
        required: true
        default: 'com/*/*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Android NDK
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Setup Tools & Comprehensive Dependencies
        run: |
          git clone --depth 1 https://github.com/codehasan/dex2c dex2c_tool
          # تثبيت كافة المكتبات الأساسية والفرعية لمحرك تحليل الأندرويد
          # أضفنا networkx لحل مشكلة تحليل الرسوم البيانية للكود
          pip install pyelftools click asn1crypto cryptography lxml requests networkx

      - name: Execute Targeted Hardening
        run: |
          if [ ! -f "${{ github.event.inputs.apk_name }}" ]; then
            echo "Error: File ${{ github.event.inputs.apk_name }} not found!"
            exit 1
          fi
          
          cd dex2c_tool
          # حماية الكود المصدري الخاص بك مع استقرار المكتبات العامة
          echo "+${{ github.event.inputs.my_package }}/*" > filter.txt
          
          python3 dcc.py \
          -a ../${{ github.event.inputs.apk_name }} \
          -o ../protected_output.apk \
          --filter filter.txt
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Professional-Protected-APK
          path: protected_output.apk

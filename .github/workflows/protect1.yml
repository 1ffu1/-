name: 🔐 Protect APK → Native .so

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: 'مسار APK داخل الـ repo (مثال: app/release/show.apk)'
        required: true
        default: 'input/app.apk'
      package_filter:
        description: 'الـ package الذي تريد تحويله (مثال: com.yourapp) — اتركه فارغاً للكل'
        required: false
        default: ''
      sign_apk:
        description: 'هل تريد توقيع APK بعد الحماية؟'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  protect:
    name: 🛡️ APK → Native Protection
    runs-on: ubuntu-22.04

    steps:
      # ─────────────────────────────────────
      # 1. سحب الـ repo
      # ─────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────
      # 2. إعداد Java 17
      # ─────────────────────────────────────
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ─────────────────────────────────────
      # 3. تثبيت Android NDK + Build Tools
      # ─────────────────────────────────────
      - name: 🤖 Setup Android NDK r26
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: 🔧 Setup Android SDK Build Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            aapt \
            zipalign \
            cmake \
            ninja-build \
            build-essential

          # apksigner عبر sdkmanager
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;34.0.0" 2>/dev/null || true

          echo "NDK: ${{ steps.setup-ndk.outputs.ndk-path }}"

      # ─────────────────────────────────────
      # 4. تحميل أدوات الحماية
      # ─────────────────────────────────────
      - name: 📦 Download dex2jar
        run: |
          mkdir -p tools
          wget -q "https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip" \
            -O tools/dex2jar.zip
          unzip -q tools/dex2jar.zip -d tools/dex2jar_extracted
          mv tools/dex2jar_extracted/dex-tools-v2.4 tools/dex2jar
          chmod +x tools/dex2jar/*.sh
          echo "✅ dex2jar جاهز"

      - name: 📦 Download apktool
        run: |
          wget -q "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar" \
            -O tools/apktool.jar
          echo "✅ apktool جاهز"

      - name: 📦 Download & Build native-obfuscator
        run: |
          git clone --depth=1 https://github.com/radioegor146/native-obfuscator.git tools/native-obfuscator
          cd tools/native-obfuscator
          chmod +x ./gradlew
          ./gradlew shadowJar -q
          JAR=$(find build/libs -name "*.jar" | head -1)
          cp "$JAR" ../native-obfuscator.jar
          echo "✅ native-obfuscator.jar جاهز"
          cd ../..

      # ─────────────────────────────────────
      # 5. التحقق من APK
      # ─────────────────────────────────────
      - name: 🔍 Validate APK
        run: |
          APK="${{ github.event.inputs.apk_path }}"
          if [ ! -f "$APK" ]; then
            echo "❌ APK غير موجود: $APK"
            echo "📂 الملفات المتاحة:"
            find . -name "*.apk" 2>/dev/null | head -20
            exit 1
          fi
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "✅ APK موجود: $APK ($SIZE)"

      # ─────────────────────────────────────
      # 6. استخراج DEX → JAR
      # ─────────────────────────────────────
      - name: 📤 DEX → JAR extraction
        run: |
          APK="${{ github.event.inputs.apk_path }}"
          mkdir -p workdir

          # استخراج ملفات dex
          echo "🔄 استخراج DEX من APK..."
          unzip -q "$APK" "*.dex" -d workdir/dex_files

          # دمج كل dex في jar واحد
          DEX_LIST=$(find workdir/dex_files -name "*.dex" | tr '\n' ' ')
          echo "📋 DEX files: $DEX_LIST"

          tools/dex2jar/d2j-dex2jar.sh \
            --output workdir/classes.jar \
            --force \
            $DEX_LIST

          echo "✅ JAR: $(du -sh workdir/classes.jar | cut -f1)"

      # ─────────────────────────────────────
      # 7. native-obfuscator: Java → C++
      # ─────────────────────────────────────
      - name: ⚙️ native-obfuscator: Classes → C++
        run: |
          mkdir -p workdir/native_output

          # Android platform jar
          ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-34/android.jar"
          if [ ! -f "$ANDROID_JAR" ]; then
            echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" 2>/dev/null
          fi

          FILTER="${{ github.event.inputs.package_filter }}"
          FILTER_ARG=""
          if [ -n "$FILTER" ]; then
            # تحويل com.example إلى com/example للفلترة
            FILTER_PATH=$(echo "$FILTER" | tr '.' '/')
            FILTER_ARG="--include $FILTER_PATH"
            echo "🎯 فلترة: $FILTER_PATH"
          fi

          echo "🔄 تحويل Classes → C++ ..."
          java -jar tools/native-obfuscator.jar \
            --input workdir/classes.jar \
            --output workdir/native_output \
            --libraries "$ANDROID_JAR" \
            $FILTER_ARG \
            --threads 4

          CPP_COUNT=$(find workdir/native_output/cpp -name "*.cpp" 2>/dev/null | wc -l)
          echo "✅ تم توليد $CPP_COUNT ملف C++"

      # ─────────────────────────────────────
      # 8. بناء .so بالـ NDK
      # ─────────────────────────────────────
      - name: 🔨 Build .so libraries (ARM64 + ARM32)
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p workdir/jniLibs

          # نسخ CMakeLists المولّد
          cp workdir/native_output/CMakeLists.txt workdir/

          # بناء لـ arm64-v8a
          echo "🔨 بناء arm64-v8a ..."
          mkdir -p workdir/build_arm64
          cmake -B workdir/build_arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -fvisibility=hidden -fstack-protector-strong" \
            -DCMAKE_CXX_FLAGS="-O3 -fvisibility=hidden -fstack-protector-strong -fno-rtti" \
            -S workdir \
            -G Ninja
          cmake --build workdir/build_arm64 --parallel $(nproc)
          mkdir -p workdir/jniLibs/arm64-v8a
          find workdir/build_arm64 -name "*.so" -exec cp {} workdir/jniLibs/arm64-v8a/ \;

          # بناء لـ armeabi-v7a
          echo "🔨 بناء armeabi-v7a ..."
          mkdir -p workdir/build_arm32
          cmake -B workdir/build_arm32 \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-O3 -fvisibility=hidden" \
            -DCMAKE_CXX_FLAGS="-O3 -fvisibility=hidden -fno-rtti" \
            -S workdir \
            -G Ninja
          cmake --build workdir/build_arm32 --parallel $(nproc)
          mkdir -p workdir/jniLibs/armeabi-v7a
          find workdir/build_arm32 -name "*.so" -exec cp {} workdir/jniLibs/armeabi-v7a/ \;

          echo "✅ .so files:"
          find workdir/jniLibs -name "*.so" | while read f; do
            echo "   $(du -sh $f)"
          done

      # ─────────────────────────────────────
      # 9. فك APK وإعادة تجميعه
      # ─────────────────────────────────────
      - name: 📦 Repackage APK with native libs
        run: |
          APK="${{ github.event.inputs.apk_path }}"

          # فك APK
          echo "🔄 فك APK..."
          java -jar tools/apktool.jar d "$APK" \
            -o workdir/apk_decoded \
            --force

          # حذف classes.dex الأصلي (الكود أصبح في .so)
          echo "🗑️ حذف DEX الأصلي..."
          rm -f workdir/apk_decoded/classes*.dex

          # نسخ كلاسات Java المعدّلة (stub classes)
          if [ -d "workdir/native_output/java" ]; then
            echo "📋 نسخ stub classes..."
            # تحويل java → smali
            javac -source 8 -target 8 \
              -classpath "$ANDROID_SDK_ROOT/platforms/android-34/android.jar" \
              $(find workdir/native_output/java -name "*.java") \
              -d workdir/stub_classes 2>/dev/null || true

            if [ -d "workdir/stub_classes" ]; then
              # تحويل class → dex
              $ANDROID_SDK_ROOT/build-tools/34.0.0/d8 \
                --output workdir/apk_decoded/ \
                $(find workdir/stub_classes -name "*.class") 2>/dev/null || true
            fi
          fi

          # نسخ .so إلى APK
          echo "📋 نسخ .so libraries..."
          mkdir -p workdir/apk_decoded/lib
          cp -r workdir/jniLibs/* workdir/apk_decoded/lib/

          # تحديث AndroidManifest لتفعيل extractNativeLibs
          python3 - << 'PYEOF'
          import re, sys
          manifest_path = "workdir/apk_decoded/AndroidManifest.xml"
          try:
              with open(manifest_path, 'r') as f:
                  content = f.read()
              # تفعيل extractNativeLibs
              if 'extractNativeLibs' not in content:
                  content = content.replace(
                      '<application',
                      '<application android:extractNativeLibs="true"',
                      1
                  )
                  with open(manifest_path, 'w') as f:
                      f.write(content)
                  print("✅ AndroidManifest محدّث")
              else:
                  print("ℹ️ AndroidManifest لا يحتاج تعديل")
          except Exception as e:
              print(f"⚠️ تحذير: {e}")
          PYEOF

          # إعادة بناء APK
          echo "🔨 إعادة بناء APK..."
          java -jar tools/apktool.jar b workdir/apk_decoded \
            -o workdir/protected_unsigned.apk \
            --use-aapt2

          echo "✅ APK مُعاد البناء: $(du -sh workdir/protected_unsigned.apk | cut -f1)"

      # ─────────────────────────────────────
      # 10. zipalign + توقيع
      # ─────────────────────────────────────
      - name: ✍️ Align & Sign APK
        if: ${{ github.event.inputs.sign_apk == 'true' }}
        run: |
          # zipalign
          echo "🔄 Zipalign..."
          $ANDROID_SDK_ROOT/build-tools/34.0.0/zipalign -v 4 \
            workdir/protected_unsigned.apk \
            workdir/protected_aligned.apk

          # توليد keystore مؤقت
          echo "🔑 توليد keystore..."
          keytool -genkey -v \
            -keystore workdir/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null

          # توقيع
          echo "✍️ توقيع APK..."
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign \
            --ks workdir/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out workdir/protected_signed.apk \
            workdir/protected_aligned.apk

          echo "✅ APK موقّع: $(du -sh workdir/protected_signed.apk | cut -f1)"

      - name: 📋 Copy final APK
        run: |
          mkdir -p output
          if [ -f "workdir/protected_signed.apk" ]; then
            cp workdir/protected_signed.apk output/protected_app.apk
          else
            cp workdir/protected_unsigned.apk output/protected_app.apk
          fi
          echo "📊 الإحصائيات:"
          echo "   APK الأصلي: $(du -sh '${{ github.event.inputs.apk_path }}' | cut -f1)"
          echo "   APK المحمي: $(du -sh output/protected_app.apk | cut -f1)"

      # ─────────────────────────────────────
      # 11. رفع النتيجة كـ artifact
      # ─────────────────────────────────────
      - name: 📤 Upload Protected APK
        uses: actions/upload-artifact@v4
        with:
          name: protected-apk-${{ github.run_number }}
          path: output/protected_app.apk
          retention-days: 7

      - name: 📤 Upload .so libraries (للمراجعة)
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-${{ github.run_number }}
          path: workdir/jniLibs/
          retention-days: 7

      # ─────────────────────────────────────
      # 12. ملخص النتيجة
      # ─────────────────────────────────────
      - name: 📊 Protection Summary
        run: |
          echo "════════════════════════════════"
          echo "   🛡️ APK Protection Complete"
          echo "════════════════════════════════"
          echo ""
          echo "📁 الملفات المولّدة:"
          find output workdir/jniLibs -type f 2>/dev/null | while read f; do
            echo "   • $f ($(du -sh $f | cut -f1))"
          done
          echo ""
          echo "🔒 تقنيات الحماية المطبّقة:"
          echo "   ✅ تحويل Java Bytecode → C++ native code"
          echo "   ✅ تجميع لـ arm64-v8a + armeabi-v7a"
          echo "   ✅ إخفاء الرموز (visibility=hidden)"
          echo "   ✅ تحسينات O3 لإخفاء الكود"
          echo "   ✅ حذف DEX الأصلي"
          echo "   ✅ Stack protector"
          echo ""
          echo "⚠️  للتوقيع بـ keystore الإنتاج:"
          echo "   أضف KEYSTORE_BASE64 في GitHub Secrets"
          echo "════════════════════════════════"

name: Extreme Dex2C Protection

on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: 'اسم ملف الـ APK (مثلاً app.apk)'
        required: true
        default: 'app.apk'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Your Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Android NDK
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Download Dex2C Tool
        run: |
          git clone --depth 1 https://github.com/codehasan/dex2c dex2c_tool
          cd dex2c_tool
          pip install -r requirements.txt || pip install click pyelftools

      - name: Execute Protection (Full Conversion)
        run: |
          if [ ! -f "${{ github.event.inputs.apk_name }}" ]; then
            echo "Error: File ${{ github.event.inputs.apk_name }} not found!"
            exit 1
          fi
          
          cd dex2c_tool
          
          # تفعيل خيار --allow-global لإجبار الأداة على تحويل كامل الكود لـ Native
          python3 dcc.py \
          -a ../${{ github.event.inputs.apk_name }} \
          -o ../protected_output.apk \
          --allow-global
          
      - name: Upload Protected APK
        uses: actions/upload-artifact@v4
        with:
          name: Hardened-App-Package
          path: protected_output.apk

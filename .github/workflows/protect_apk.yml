name: Extreme Dex2C Protection

on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: 'اسم ملف الـ APK الموجود في المستودع'
        required: true
        default: 'base.apk'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Your Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Android NDK
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Download Dex2C Tool
        uses: actions/checkout@v4
        with:
          repository: D-Code/dex2c
          path: dex2c_tool

      - name: Install Dependencies
        run: |
          if [ -f dex2c_tool/requirements.txt ]; then
            pip install -r dex2c_tool/requirements.txt
          fi
          pip install click  # أداة dex2c الأساسية تحتاج هذه المكتبة

      - name: Execute Protection (Dex2C)
        run: |
          # تأكد أن ملف الـ APK موجود في المجلد الرئيسي
          python3 dex2c_tool/dex2c.py ${{ github.event.inputs.apk_name }} \
          --ndk ${{ env.ANDROID_NDK_HOME }} \
          --output protected_output.apk

      - name: Upload Protected APK
        uses: actions/upload-artifact@v4
        with:
          name: Hardened-App-Package
          path: protected_output.apk

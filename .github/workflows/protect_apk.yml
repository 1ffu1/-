name: Professional Targeted Protection

on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: 'اسم ملف الـ APK'
        required: true
        default: 'app.apk'
      my_package:
        description: 'مسار الكود الخاص بك فقط (مثال: com/example/myapp)'
        required: true
        default: 'com/*/*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Setup Tools
        run: |
          git clone --depth 1 https://github.com/codehasan/dex2c dex2c_tool
          pip install pyelftools click

      - name: Execute Targeted Hardening
        run: |
          cd dex2c_tool
          
          # الطريقة الاحترافية: حماية الباكج نيم الخاص بك فقط + أي مكتبة خارجية محددة
          # نستخدم علامة + متبوعة بالمسار بدون رموز معقدة لتجنب أخطاء Regex
          echo "+${{ github.event.inputs.my_package }}/*" > filter.txt
          
          python3 dcc.py \
          -a ../${{ github.event.inputs.apk_name }} \
          -o ../protected_output.apk \
          --filter filter.txt
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Professional-Protected-APK
          path: protected_output.apk

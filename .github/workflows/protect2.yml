name: Build Protected APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct APK URL"
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android NDK
        id: setup_ndk_r26d
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y wget unzip git zip python3 cmake ninja-build

      - name: Download APK
        run: |
          wget -O input.apk "${{ github.event.inputs.apk_url }}"

      - name: Decode APK with apktool
        run: |
          wget https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
          java -jar apktool.jar d input.apk -o apk_decoded

      - name: Extract DEX
        run: |
          unzip -o input.apk -d extracted_apk
          mkdir dex_files
          find extracted_apk -name "*.dex" -exec cp {} dex_files/ \;

      - name: Clone native-obfuscator
        run: |
          git clone https://github.com/radioegor146/native-obfuscator.git

      - name: Patch build.gradle
        run: |
          python3 -c "
import os
path='native-obfuscator/obfuscator/build.gradle'
with open(path,'a') as f:
    f.write('\n\ntasks.withType(com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configureEach {\n')
    f.write('    mergeServiceFiles()\n')
    f.write(\"    exclude 'META-INF/*.SF'\\n\")
    f.write(\"    exclude 'META-INF/*.DSA'\\n\")
    f.write(\"    exclude 'META-INF/*.RSA'\\n\")
    f.write('    duplicatesStrategy = DuplicatesStrategy.EXCLUDE\n')
    f.write('}\n')
"

      - name: Build native-obfuscator
        run: |
          cd native-obfuscator
          ./gradlew build shadowJar

      - name: Get obfuscator JAR
        run: |
          cd native-obfuscator/obfuscator/build/libs
          ls -lh
          JAR=$(ls -S *.jar | grep -v plain | head -n 1)
          echo "JAR=$JAR" >> $GITHUB_ENV

      - name: Convert DEX to JAR
        run: |
          wget https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-2.4.zip
          unzip dex-tools-2.4.zip
          chmod +x dex-tools-2.4/*.sh
          mkdir jar_files
          for f in dex_files/*.dex; do
            dex-tools-2.4/d2j-dex2jar.sh "$f" -o jar_files/$(basename "$f" .dex).jar
          done

      - name: Run native-obfuscator
        run: |
          mkdir cpp_output
          for f in jar_files/*.jar; do
            java -jar native-obfuscator/obfuscator/build/libs/$JAR "$f" cpp_output
          done

      - name: Build .so libraries
        run: |
          mkdir build_so
          cd build_so
          cmake ../cpp_output -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          cmake --build .

          mkdir ../libs/arm64-v8a -p
          find . -name "*.so" -exec cp {} ../libs/arm64-v8a/ \;

          rm -rf *
          cmake ../cpp_output -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-21 -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          cmake --build .

          mkdir ../libs/armeabi-v7a -p
          find . -name "*.so" -exec cp {} ../libs/armeabi-v7a/ \;

      - name: Replace DEX with SO
        run: |
          rm apk_decoded/classes*.dex || true
          mkdir -p apk_decoded/lib/arm64-v8a
          mkdir -p apk_decoded/lib/armeabi-v7a
          cp libs/arm64-v8a/*.so apk_decoded/lib/arm64-v8a/ || true
          cp libs/armeabi-v7a/*.so apk_decoded/lib/armeabi-v7a/ || true

      - name: Rebuild APK
        run: |
          java -jar apktool.jar b apk_decoded -o unsigned.apk

      - name: Sign APK
        run: |
          wget https://dl.google.com/android/repository/build-tools_r34-linux.zip
          unzip build-tools_r34-linux.zip
          KEYSTORE=keystore.jks
          keytool -genkey -v -keystore $KEYSTORE -storepass password -alias alias -keypass password -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Test,O=Test,C=US"
          build-tools/android-34/apksigner sign --ks $KEYSTORE --ks-pass pass:password --key-pass pass:password --out signed.apk unsigned.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: protected-apk
          path: signed.apk

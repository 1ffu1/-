name: Professional Targeted Protection (Fixed & Stable)

on:
  workflow_dispatch:
    inputs:
      apk_name:
        description: 'اسم ملف الـ APK (مثلاً app.apk)'
        required: true
        default: 'app.apk'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Android NDK
        run: |
          echo "y" | sudo ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Setup Tools & Comprehensive Dependencies
        run: |
          git clone --depth 1 https://github.com/codehasan/dex2c dex2c_tool
          # تثبيت كافة المكتبات اللازمة لضمان عدم توقف Androguard
          pip install pyelftools click asn1crypto cryptography lxml requests networkx

      - name: Create Precision Filter File
        run: |
          # التحليل: الأداة لا تقبل (+) أو (-). نستخدم Regex يبدأ بـ ^L لمنع خطأ البايثون.
          # هذا السطر يحمي كل شيء (.*) بشرط ألا يكون (?!...) تابعاً لمكتبات النظام.
          echo '^L(?!android/|androidx/|com/google/|com/android/|kotlin/|okhttp3/|okio/|org/xmlpull/).*' > dex2c_tool/filter.txt

      - name: Execute Targeted Hardening
        run: |
          if [ ! -f "${{ github.event.inputs.apk_name }}" ]; then
            echo "Error: File ${{ github.event.inputs.apk_name }} not found!"
            exit 1
          fi
          
          cd dex2c_tool
          
          # تشغيل dcc باستخدام الفلتر المصلح برمجياً
          python3 dcc.py \
          -a ../${{ github.event.inputs.apk_name }} \
          -o ../protected_output.apk \
          --filter filter.txt \
          --allow-global
          
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Professional-Protected-APK
          path: protected_output.apk
